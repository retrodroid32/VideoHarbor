plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.videoharbor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.videoharbor'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        // Native yt-dlp/FFmpeg executables need ABI-matched shared libraries.
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// yt-dlp handles streaming formats and FFmpeg merges separate audio/video.
// GPL-3.0: https://github.com/yausername/youtubedl-android/blob/master/LICENSE
dependencies {
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
